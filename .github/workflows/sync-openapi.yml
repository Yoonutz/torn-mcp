name: Sync OpenAPI

# Weekly check for Torn OpenAPI spec changes. Regenerates the endpoint catalog,
# gates on typecheck + tests, and commits straight to main only if everything
# passes (main's ruleset is bypassed via the admin-owned GH_PAT). A failing run
# (e.g. a spec change that breaks the build) commits nothing and notifies you.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

# Least privilege: the default token only reads. The push authenticates with
# GH_PAT, given to the push step only (never persisted in .git/config).
permissions:
  contents: read

concurrency:
  group: sync-openapi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # npm ci, the spec sync and the tests run third-party code; none of it
          # may see the admin PAT.
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sync-openapi
      - run: npm run typecheck
      - run: npm test
      - name: Commit regenerated files if the spec changed
        id: commit
        run: |
          if [ ! -f .sync-msg.txt ]; then
            echo "No sync changes — nothing to commit."
            exit 0
          fi
          git config user.name "torn-mcp-sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi.json src/generated docs/generated README.md
          if git diff --cached --quiet; then
            echo ".sync-msg.txt exists, but generated sync files are unchanged — nothing to commit."
            exit 0
          fi
          # .sync-msg.txt is gitignored scratch: it is only the commit message
          # (read by -F), never staged.
          git commit -F .sync-msg.txt
          echo "push=true" >> "$GITHUB_OUTPUT"

      - name: Push sync commit
        if: ${{ steps.commit.outputs.push == 'true' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
