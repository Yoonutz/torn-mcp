name: Conformance

# Weekly live conformance: call every Torn endpoint with the test key and
# validate each response against its OpenAPI schema. Without the
# TORN_TEST_API_KEY secret the harness runs in compile-check mode (no calls).
# Non-gating for PRs; a real schema mismatch fails this run and notifies.
#
# Before every check the job syncs Torn's latest OpenAPI spec and regenerates
# derived artifacts in-workspace (no commit). This guarantees conformance is
# always evaluated against the current schema, not a potentially stale snapshot
# committed days or weeks earlier.

on:
  schedule:
    - cron: "0 7 * * 3" # Wednesdays 07:00 UTC
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Snapshot the current drift as the accepted baseline and commit it (manual refresh)"
        type: boolean
        default: false

# Least privilege: the default token only reads. The baseline-refresh push
# authenticates with GH_PAT (persisted by checkout), not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Needed only by the baseline-refresh path to push to main (ruleset
          # bypassed via the admin PAT); harmless for the read-only check run.
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Sync Torn's latest OpenAPI spec and regenerate derived artifacts so the
      # conformance check (and any baseline refresh) always uses the current
      # schema. This step intentionally does NOT commit — the repo is left in a
      # "dirty but correct" state for the steps that follow.
      - name: Sync OpenAPI (no commit)
        run: |
          npm run sync-openapi
          node scripts/generate-endpoints.mjs

      # Scheduled run, or manual run without the refresh box ticked: read-only
      # check. Fails the run on new drift. Both reports land in the run summary;
      # no artifact upload needed.
      - name: Run conformance
        if: ${{ inputs.update_baseline != true }}
        env:
          TORN_TEST_API_KEY: ${{ secrets.TORN_TEST_API_KEY }}
        run: node scripts/conformance.mjs

      # Manual refresh: re-snapshot Torn's standing drift into the baseline, show
      # exactly what moved in the run summary, then commit only if it changed.
      #
      # Atomic with the spec: the sync step above may have pulled a newer
      # openapi.json, so the spec, every generated artifact (catalog, manifest,
      # types, README table, changelog) and the baseline are committed TOGETHER.
      # Committing endpoints.ts alone against an older committed spec would fail
      # the contract test's specHash check on main.
      - name: Refresh baseline
        if: ${{ inputs.update_baseline == true }}
        env:
          TORN_TEST_API_KEY: ${{ secrets.TORN_TEST_API_KEY }}
        run: |
          # Live run snapshots the baseline AND writes auto-derived overrides;
          # then bake those overrides into the committed catalog + types + README.
          node scripts/conformance.mjs --update-baseline
          npm run generate
          npm run typecheck
          npm test
          FILES="conformance-baseline.json scripts/lib/returns-overrides.generated.json openapi.json src/generated docs/generated README.md"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "Baseline, overrides and spec unchanged — nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Conformance refresh"
            echo "Review the accepted drift and auto-derived shapes below before trusting the next run:"
            echo '```diff'
            git --no-pager diff --stat $FILES
            git --no-pager diff conformance-baseline.json scripts/lib/returns-overrides.generated.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "torn-mcp-conformance"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Refresh conformance baseline and auto-derived overrides"
          git push
